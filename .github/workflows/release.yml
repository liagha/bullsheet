name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/bullsheet.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/bullsheet.exe, package/README.md -DestinationPath bullsheet-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bullsheet-windows-x86_64.zip
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir package
          cp target/x86_64-unknown-linux-gnu/release/bullsheet package/
          cp README.md package/
          tar -czf bullsheet-linux-x86_64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: bullsheet-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bullsheet.app/Contents/MacOS
          mkdir -p bullsheet.app/Contents/Resources
          lipo -create \
            target/aarch64-apple-darwin/release/bullsheet \
            target/x86_64-apple-darwin/release/bullsheet \
            -output bullsheet.app/Contents/MacOS/bullsheet
          chmod +x bullsheet.app/Contents/MacOS/bullsheet
          cp README.md bullsheet.app/Contents/Resources/README.md
          cat > bullsheet.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>bullsheet</string>
            <key>CFBundleDisplayName</key>
            <string>bullsheet</string>
            <key>CFBundleIdentifier</key>
            <string>com.bullsheet.app</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleExecutable</key>
            <string>bullsheet</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          zip -r bullsheet-macos-universal.zip bullsheet.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: bullsheet-macos-universal.zip
          if-no-files-found: error

  release:
    needs:
      - windows
      - linux
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \))
