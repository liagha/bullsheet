[package]
name = "bullsheet"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A borderless, multiline pop-up calculator"
license = "MIT"

[dependencies]
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
global-hotkey = "0.9"
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
