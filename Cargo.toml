[workspace]
members = ["crates/bullsheet", "crates/element", "crates/evaluator"]
default-members = ["crates/bullsheet"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
element = { path = "crates/element" }
evaluator = { path = "crates/evaluator" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
