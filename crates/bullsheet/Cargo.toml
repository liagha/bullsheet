[package]
name = "bullsheet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A borderless, multiline pop-up calculator"
license.workspace = true

[[bin]]
name = "bullsheet"
path = "src/main.rs"

[dependencies]
directories = "6.0"
element.workspace = true
evaluator.workspace = true
global-hotkey = "0.9"
masonry = "0.4"
masonry_winit = "0.4"
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
tracing = "0.1"
unicode-script = "0.5.7"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
